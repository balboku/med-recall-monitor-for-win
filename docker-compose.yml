version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medwatch_postgres
    environment:
      POSTGRES_USER: medwatch_user
      POSTGRES_PASSWORD: medwatch_password
      POSTGRES_DB: medwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medwatch_user -d medwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medwatch_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: medwatch_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medwatch_user:medwatch_password@postgres:5432/medwatch
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173
      - PYTHONPATH=/app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    container_name: medwatch_worker
    environment:
      - DATABASE_URL=postgresql://medwatch_user:medwatch_password@postgres:5432/medwatch
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: medwatch_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: medwatch_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
